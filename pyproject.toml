[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitasentrion"
version = "0.1.0"
description = "VitaSentrion: Zero-Dependency Firewall, Loop Breaker & Quality Linter for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VitaLogic Labs", email = "research@vitalogiclabs.com"}]

[project.scripts]
vitasentrion = "vitasentrion.cli:main"
